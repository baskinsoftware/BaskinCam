// BaskinCam EISI - app/build.gradle
// Autore: Daniele Lolli (UncleDan)

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.baskinsoftware.baskincameisi'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.baskinsoftware.baskincameisi"
        minSdk 26
        targetSdk 35
        // Regola di versioning dei progetti Baskin (v3): AA.M[.P[.W]] con eventuale
        // suffisso aN | bN | RCN (26.0a3 = terza alpha della 26.0).
        // versionCode = (((AA*100 + M)*100 + P)*10 + W)*100 + contatore, con
        // contatore 01-98 per le pre-release (il numero del suffisso) e 99 per la
        // finale: 26.0a3 -> 260000003, 26.0 -> 260000099, 26.0.1 -> 260001099.
        // Valori letterali (F-Droid): la coerenza e' verificata qui sotto.
        versionCode 260000003
        versionName "26.0a3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Verifica in build che versionCode rispetti la formula della regola v3.
    def vn = defaultConfig.versionName
    def vc = defaultConfig.versionCode
    def mv = (vn =~ /^(\d{2})\.(\d{1,2})(?:\.(\d{1,2})(?:\.([1-9]))?)?(?:(a|b|RC)(\d{1,2}))?$/)
    if (!mv.matches()) throw new GradleException("versionName non conforme alla regola di versioning: " + vn)
    def alto = ((((mv.group(1) as int) * 100 + (mv.group(2) as int)) * 100 + ((mv.group(3) ?: '0') as int)) * 10 + ((mv.group(4) ?: '0') as int)) * 100
    def cnt = vc - alto
    if (mv.group(5) ? !(cnt >= 1 && cnt <= 98) : cnt != 99)
        throw new GradleException("versionCode " + vc + " non coerente con versionName " + vn + " (atteso " + alto + " + contatore " + (mv.group(5) ? "01-98" : "99") + ")")

    // Firma release opzionale via variabili d'ambiente (usate dalla GitHub
    // Action app-android.yml). In locale, senza queste variabili, assembleRelease
    // produce un APK non firmato: per l'uso quotidiano si usa assembleDebug.
    signingConfigs {
        release {
            def kf = System.getenv("KEYSTORE_FILE")
            if (kf != null) {
                storeFile file(kf)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // le build di debug portano il suffisso "-debug" nel versionName,
            // riconoscibili a colpo d'occhio rispetto alla release
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false // nessuna minificazione/offuscamento per ora
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // firma solo se il keystore e' configurato via ambiente
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0' // AOSP-compatible, no Play Services

    // LifecycleService: fa da LifecycleOwner per CameraX dentro il Foreground Service
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'

    // Camera
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'

    // Detection palla (cosmetico) - MediaPipe Tasks Vision
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // Streaming RTMP - RootEncoder (AGPL-3.0: determina la licenza del progetto, vedi LICENSE)
    implementation 'com.github.pedroSG94.RootEncoder:library:2.5.3'

    // Web server locale per controllo remoto + ricezione punteggio
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // JSON
    implementation 'org.json:json:20240303'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
