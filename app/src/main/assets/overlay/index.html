<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Tabellone Baskin EISI - Display</title>
<style>
  /*
   * Display fedele a Tabellone Baskin v1.13.3 (app.js/styles.css reali,
   * non ricostruzione a memoria). Colori, algoritmo dei segmenti, soglia
   * di luminanza e logica bonus/timer FIBA sono copiati 1:1 dal sorgente.
   *
   * Adattamento dimensionale: il box reale della PWA e' pensato per
   * schermo intero (unita' vh/vw); qui il WebView e' un riquadro fisso
   * piccolo (angolo del video), quindi le dimensioni sono in px fissi,
   * scalate proporzionalmente (fattore ~0.35) dai valori massimi dei
   * clamp() originali - stesso rapporto tra gli elementi, box compatto.
   * Il layout e' impilato verticalmente (nome+punteggio+falli per
   * squadra, poi periodo+tempo) invece della griglia orizzontale a
   * schermo intero, per stare comodo nell'angolo.
   */
  :root{
    --bg: #000;
    --white: #ffffff;
    --green: #1ee63a;
    --red: #ff2b2b;
    --yellow: #ffd21a;
    --dimseg: 0.07;
    --bonus-off: #5a1212;
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    width: 100%; height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--white);
    overflow: hidden;
    user-select: none;
  }
  #board { padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; height: 100%; box-sizing: border-box; }

  .team-block { display: flex; flex-direction: column; }
  .team-head { display: flex; align-items: center; justify-content: space-between; }
  .team-name{
    font-weight: 800;
    font-size: 20px;
    line-height: 1.05;
    max-width: 60%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* lieve bordatura bianca per colori scuri (soglia luminanza 0.25, come originale) */
  .team-name.outline{
    text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 1.5px #fff;
  }

  .score{ color: var(--green); display:flex; align-items:center; gap:.08em; }
  .score.outline-svg{ filter: drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff); }
  .score .seg-digit{ height: 34px; }

  .sub-row{ display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:1px; }
  .foul-num{ color: var(--yellow); display:flex; align-items:center; gap:.08em; }
  .foul-num .seg-digit{ height: 14px; }
  .foul-num.hidden{ display:none; }

  .bonus-dot{
    width: 10px; height: 10px; border-radius: 50%;
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--bonus-off);
    transition: background .15s ease, box-shadow .15s ease;
  }
  .bonus-dot.active{ background: var(--red); box-shadow: 0 0 5px rgba(255,43,43,.7); }
  .auto-bonus .bonus-dot.active{ animation: bonusPulse 1s ease-in-out infinite; }
  @keyframes bonusPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }

  .timeouts{
    display:inline-flex; align-items:center; gap: 3px;
    border: 2px solid var(--white); border-radius: 999px;
    padding: 2px 6px;
  }
  .to-dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.4);
  }
  .to-dot.on{ background: var(--white); box-shadow: 0 0 3px rgba(255,255,255,.55); }

  .possession{ display:flex; align-items:center; justify-content:center; gap:10px; margin: 2px 0; }
  .possession.hidden{ display:none; }
  .poss-arrow{ color: var(--bonus-off); font-size: 15px; line-height:1; }
  .poss-arrow.active{ color: var(--green); text-shadow: 0 0 4px rgba(30,230,58,.7); }

  .bottom-row{
    display:flex; align-items:center; justify-content:space-between;
    border-top: 1px solid #333; margin-top: 4px; padding-top: 4px;
  }
  .period{ display:flex; align-items:center; gap: 4px; }
  .period-num .seg-digit{ height: 22px; }
  .period-num .seg{ fill: currentColor; }
  .period-num .seg.off{ opacity: var(--dimseg); }
  .period-ind{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .ind-deg{ height: 8px; width:auto; color:#fff; opacity: var(--dimseg); }
  .ind-ts{ font-weight:900; font-size: 6px; color: var(--red); opacity: var(--dimseg); }
  .period:not(.ot) .ind-deg{ opacity: 1; }
  .period.ot .ind-ts{ opacity: 1; text-shadow: 0 0 4px rgba(255,43,43,.6); }

  .timer{ color: var(--red); display:flex; align-items:center; gap:.08em; }
  .timer .seg-digit{ height: 30px; }

  .seg-digit{ display:inline-block; width:auto; vertical-align:middle; }
  .seg-digit .seg{ fill: currentColor; }
  .seg-digit .seg.off{ opacity: var(--dimseg); }
  .seg-colon{ height: 30px; width:auto; color: var(--red); vertical-align:middle; }
  .seg-colon .dot{ fill: currentColor; }
</style>
</head>
<body>
  <div id="board">
    <div class="team-block" id="teamBlock0">
      <div class="team-head">
        <span id="name0" class="team-name">Squadra 1</span>
        <span id="score0" class="score"></span>
      </div>
      <div class="sub-row">
        <span id="fouls0" class="foul-num"></span>
        <span id="bonus0" class="bonus-dot"></span>
        <span id="to0" class="timeouts"></span>
      </div>
    </div>

    <div id="possessionRow" class="possession hidden">
      <span id="possLeft" class="poss-arrow">&#9664;</span>
      <span class="poss-label" style="font-size:10px;opacity:.8;">POSSESSO</span>
      <span id="possRight" class="poss-arrow">&#9654;</span>
    </div>

    <div class="team-block" id="teamBlock1">
      <div class="team-head">
        <span id="name1" class="team-name">Squadra 2</span>
        <span id="score1" class="score"></span>
      </div>
      <div class="sub-row">
        <span id="fouls1" class="foul-num"></span>
        <span id="bonus1" class="bonus-dot"></span>
        <span id="to1" class="timeouts"></span>
      </div>
    </div>

    <div class="bottom-row">
      <span id="period" class="period"></span>
      <span id="time" class="timer"></span>
    </div>
  </div>

<script>
/* =====================================================================
   DISPLAY A 7 SEGMENTI - copia esatta dell'algoritmo di Tabellone Baskin
   (app.js: SEG_MAP, buildSegmentPolygons/SEG_POLY, digitSVG, colonSVG).
   ===================================================================== */
const SEG_MAP = {
  '0':['a','b','c','d','e','f'],
  '1':['b','c'],
  '2':['a','b','g','e','d'],
  '3':['a','b','g','c','d'],
  '4':['f','g','b','c'],
  '5':['a','f','g','c','d'],
  '6':['a','f','g','e','c','d'],
  '7':['a','b','c'],
  '8':['a','b','c','d','e','f','g'],
  '9':['a','b','c','d','f','g'],
  ' ':[]
};

function buildSegmentPolygons(){
  const W=100,H=180,p=11,ht=8,inset=5;
  const xL=p, xR=W-p, yA=p, yG=H/2, yD=H-p;
  const hx1=xL+inset, hx2=xR-inset;
  const horiz = (yc)=>[
    [hx1,yc],[hx1+ht,yc-ht],[hx2-ht,yc-ht],[hx2,yc],[hx2-ht,yc+ht],[hx1+ht,yc+ht]
  ];
  const vert = (xc,y1,y2)=>{
    const a=y1+inset, b=y2-inset;
    return [[xc,a],[xc+ht,a+ht],[xc+ht,b-ht],[xc,b],[xc-ht,b-ht],[xc-ht,a+ht]];
  };
  const toStr = pts => pts.map(p=>p.join(',')).join(' ');
  return {
    a: toStr(horiz(yA)),
    g: toStr(horiz(yG)),
    d: toStr(horiz(yD)),
    f: toStr(vert(xL,yA,yG)),
    b: toStr(vert(xR,yA,yG)),
    e: toStr(vert(xL,yG,yD)),
    c: toStr(vert(xR,yG,yD))
  };
}
const SEG_POLY = buildSegmentPolygons();

function digitSVG(ch){
  const on = new Set(SEG_MAP[ch] || []);
  let polys = '';
  for(const seg of ['a','b','c','d','e','f','g']){
    const cls = on.has(seg) ? 'seg' : 'seg off';
    polys += `<polygon class="${cls}" points="${SEG_POLY[seg]}"/>`;
  }
  return `<svg class="seg-digit" viewBox="0 0 100 180" aria-hidden="true">${polys}</svg>`;
}

function colonSVG(){
  return `<svg class="seg-colon" viewBox="0 0 30 180" aria-hidden="true">`+
         `<circle class="dot" cx="15" cy="64" r="9"/>`+
         `<circle class="dot" cx="15" cy="116" r="9"/></svg>`;
}

function renderNumber(el, value){
  el.innerHTML = [...String(value)].map(digitSVG).join('');
}

/* =====================================================================
   COLORE NOME SQUADRA - luminanza WCAG, soglia 0.25 come nell'originale.
   ===================================================================== */
function luminance(hex){
  const c = String(hex||'#ffffff').replace('#','');
  if(c.length < 6) return 1;
  const r = parseInt(c.substr(0,2),16)/255, g = parseInt(c.substr(2,2),16)/255, b = parseInt(c.substr(4,2),16)/255;
  const lin = x => (x <= 0.03928) ? x/12.92 : Math.pow((x+0.055)/1.055, 2.4);
  return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
}

/* =====================================================================
   TEMPO - porting esatto di renderTimer/mmss (regola FIBA: decimi negli
   ultimi 60 secondi di ogni periodo/supplementare).
   ===================================================================== */
function pad2(n){ return String(n).padStart(2,'0'); }
function mmss(ms){
  const t = Math.max(0, Math.ceil(ms/1000));
  return [ pad2(Math.floor(t/60)), pad2(t%60) ];
}
function renderTimerHtml(remainingMs){
  const ms = Math.max(0, remainingMs);
  const tenths = Math.ceil(ms / 100);
  if(tenths >= 600){
    const [mm, ss] = mmss(ms);
    return digitSVG(mm[0]) + digitSVG(mm[1]) + colonSVG() + digitSVG(ss[0]) + digitSVG(ss[1]);
  } else {
    const ss = pad2(Math.floor(tenths / 10));
    const d  = String(tenths % 10);
    return digitSVG(ss[0]) + digitSVG(ss[1]) + colonSVG() + digitSVG(d);
  }
}

/* =====================================================================
   TIMEOUT POOL - porting di timeoutPool(period) da app.js.
   ===================================================================== */
function timeoutPool(period, cfg){
  const periodsRegular = cfg.periodsRegular || 4;
  if(cfg.timeoutMode === 'fiba'){
    if(period > periodsRegular) return cfg.timeoutsOvertime || 1;
    const half = Math.ceil(periodsRegular / 2);
    return (period <= half) ? 2 : 3;
  }
  return (period > periodsRegular) ? (cfg.timeoutsOvertime || 1) : (cfg.timeoutsPerHalf || 2);
}

/* =====================================================================
   BONUS - porting di autoBonusActive()/updateBonus() da app.js.
   Per bonusMode 'teamFouls' il latch e' gestito dalla PWA stessa
   (state.bonusActive), qui si legge il valore gia' risolto nel payload.
   ===================================================================== */
function resolveBonus(state){
  const cfg = state.config || {};
  if(cfg.bonusMode === 'last2'){
    const periodsRegular = cfg.periodsRegular || 4;
    const inFinalPhase = state.period >= periodsRegular;
    const shownSeconds = Math.ceil(state.remainingMs / 1000);
    const auto = inFinalPhase && shownSeconds < 120;
    return { left: auto, right: auto, auto };
  }
  if(cfg.bonusMode === 'teamFouls'){
    const b = state.bonusActive || [false, false];
    return { left: !!b[0], right: !!b[1], auto: false };
  }
  return { left: false, right: false, auto: false };
}

/* =====================================================================
   RENDER STATO COMPLETO
   ===================================================================== */
function aggiornaDisplay(state) {
  const cfg = state.config || {};
  const nameEl = [document.getElementById('name0'), document.getElementById('name1')];
  const scoreEl = [document.getElementById('score0'), document.getElementById('score1')];
  const foulEl = [document.getElementById('fouls0'), document.getElementById('fouls1')];
  const bonusEl = [document.getElementById('bonus0'), document.getElementById('bonus1')];
  const toEl = [document.getElementById('to0'), document.getElementById('to1')];

  for (let i = 0; i < 2; i++) {
    const col = (state.colors && state.colors[i]) || '#ffffff';
    nameEl[i].textContent = state.names[i];
    nameEl[i].style.color = col;
    const dark = luminance(col) < 0.25;
    nameEl[i].classList.toggle('outline', dark);

    renderNumber(scoreEl[i], state.scores[i]);
    scoreEl[i].style.color = cfg.scoreTeamColor ? col : '';
    scoreEl[i].classList.toggle('outline-svg', !!cfg.scoreTeamColor && dark);

    if (cfg.manualFouls) {
      foulEl[i].classList.remove('hidden');
      renderNumber(foulEl[i], state.fouls[i]);
    } else {
      foulEl[i].classList.add('hidden');
    }

    // pool + pallini accesi (senza lo stato "blocked": non necessario per un display di sola lettura)
    const pool = timeoutPool(state.period, cfg);
    toEl[i].innerHTML = '';
    toEl[i].style.display = pool > 0 ? 'inline-flex' : 'none';
    for (let d = 0; d < pool; d++) {
      const dot = document.createElement('span');
      dot.className = 'to-dot' + (d < (state.timeoutsUsed[i] || 0) ? ' on' : '');
      toEl[i].appendChild(dot);
    }
  }

  const bonus = resolveBonus(state);
  bonusEl[0].classList.toggle('active', bonus.left);
  bonusEl[1].classList.toggle('active', bonus.right);
  document.getElementById('board').classList.toggle('auto-bonus', bonus.auto);

  const possRow = document.getElementById('possessionRow');
  if (cfg.possession) {
    possRow.classList.remove('hidden');
    const poss = state.possession || [false, false];
    document.getElementById('possLeft').classList.toggle('active', !!poss[0]);
    document.getElementById('possRight').classList.toggle('active', !!poss[1]);
  } else {
    possRow.classList.add('hidden');
  }

  const periodsRegular = cfg.periodsRegular || 4;
  const isOT = state.period > periodsRegular;
  const num = isOT ? (state.period - periodsRegular) : state.period;
  const periodEl = document.getElementById('period');
  periodEl.classList.toggle('ot', isOT);
  periodEl.innerHTML =
    `<span class="period-num">${digitSVG(String(num))}</span>` +
    `<span class="period-ind">` +
      `<svg class="ind-deg" viewBox="0 0 40 44" aria-hidden="true"><circle cx="20" cy="15" r="10" fill="none" stroke="currentColor" stroke-width="7"/></svg>` +
      `<span class="ind-ts">TS</span>` +
    `</span>`;

  document.getElementById('time').innerHTML = renderTimerHtml(state.remainingMs);
}

/* =====================================================================
   POLLING - unica fonte di verita' e' /status sul server locale
   BaskinCam. Usato sia dal WebView offscreen (overlay video) sia da un
   browser esterno che apre /display su TV/tablet.
   ===================================================================== */
const POLL_INTERVAL_MS = 1000;
let lastRunning = false;
let lastKnownState = null;
let lastFetchTs = 0;

function pollStatus() {
  fetch('/status', { cache: 'no-store' })
    .then(r => r.json())
    .then(state => {
      lastKnownState = state;
      lastRunning = !!state.running;
      lastFetchTs = Date.now();
      aggiornaDisplay(state);
    })
    .catch(() => { /* mantiene l'ultimo stato a schermo */ });
}

function localTick() {
  if (lastKnownState && lastRunning) {
    const elapsed = Date.now() - lastFetchTs;
    const interpolated = Object.assign({}, lastKnownState, {
      remainingMs: Math.max(0, lastKnownState.remainingMs - elapsed)
    });
    aggiornaDisplay(interpolated);
  }
}

setInterval(pollStatus, POLL_INTERVAL_MS);
setInterval(localTick, 200);
pollStatus();
</script>
</body>
</html>
