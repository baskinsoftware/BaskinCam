name: Beta APK (debug)

# Compila un APK di DEBUG, firmato solo con la chiave di debug automatica di
# Android (per questo chiamato "unsigned": non e' la firma di produzione),
# senza bisogno di keystore ne' segreti.
#
# Si avvia ad ogni push sul branch "beta" (anche a mano dal tab Actions, per
# comodita' di test).
#
# Produce come artifact del run: BaskinCam-beta-<short-sha>-unsigned.zip,
# contenente BaskinCam-beta-<short-sha>-unsigned.apk.
# Esempio: commit 5ecb862... -> BaskinCam-beta-5ecb862-unsigned.apk dentro
# BaskinCam-beta-5ecb862-unsigned.zip.
#
# Il wrapping in .zip con questo nome esatto e' automatico: GitHub confeziona
# sempre l'artifact scaricato dall'interfaccia "Actions" in uno zip che prende
# il nome dell'artifact stesso (il parametro "name" di upload-artifact), quindi
# basta caricare il solo file .apk con quel nome come artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - beta

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calcola lo short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # L'Android SDK e' preinstallato sui runner GitHub (ANDROID_HOME).
      # android-actions/setup-android@v3 non funziona piu' su ubuntu-26.04
      # (esegue "sdkmanager tools", pacchetto inesistente): si usa lo
      # sdkmanager preinstallato per licenze e componenti necessari.
      - name: Prepara Android SDK (preinstallato sul runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Build APK debug (unsigned)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepara l'APK con il nome definitivo
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/BaskinCam-beta-${{ steps.vars.outputs.sha }}-unsigned.apk"

      - name: Carica l'APK beta come artifact (zip automatico)
        uses: actions/upload-artifact@v4
        with:
          name: BaskinCam-beta-${{ steps.vars.outputs.sha }}-unsigned
          path: out/BaskinCam-beta-${{ steps.vars.outputs.sha }}-unsigned.apk
