name: Release APK

# Si avvia al push di un tag "v*" (es. v26.0a3).
# Produce ESATTAMENTE un asset, allegato alla GitHub Release creata per il tag:
#   BaskinCam-<tag>-signed.apk
# Esempio: il tag v26.0a3 produce "BaskinCam-v26.0a3-signed.apk".
#
# Titolo e testo della Release vengono dal README.md:
#   titolo = primo titolo "# " del README + spazio + tag (es. "BaskinCam v26.0a3")
#   testo  = README a partire dalla prima riga non vuota dopo il titolo (i link
#            relativi diventano assoluti verso il tag, altrimenti si romperebbero
#            nella pagina della Release)
# I tag alpha/beta (es. v26.0a3, v26.0b1) sono marcati come pre-release.
#
# Questo workflow produce solo APK FIRMATI: se i 4 segreti di firma non sono
# configurati, il job fallisce subito con un messaggio esplicito invece di
# produrre un APK non firmato con un nome che dichiara il contrario.
#
# Segreti richiesti (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    -> il file .jks codificato in base64
#   KEYSTORE_PASSWORD  -> password dello store
#   KEY_ALIAS          -> alias della chiave
#   KEY_PASSWORD       -> password della chiave
# Vedi COMPILAZIONE-E-RELEASE.md §3 per la procedura di generazione/configurazione.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara titolo e testo della Release dal README
        id: notes
        run: |
          set -euo pipefail
          title=$(grep -m1 '^# ' README.md | sed 's/^# *//')
          if [ -z "$title" ]; then
            echo "::error::README.md senza titolo di primo livello ('# ...')"
            exit 1
          fi
          # testo = README dalla prima riga non vuota dopo il primo titolo;
          # i link relativi ai file del repo diventano assoluti verso il tag
          awk 'found && !started && NF==0 {next} found {started=1; print} /^# / && !found {found=1}' README.md \
            | sed -E "s#\]\((\./)?([A-Za-z0-9_][A-Za-z0-9_./-]*)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\2)#g" \
            > "$RUNNER_TEMP/release-body.md"
          echo "name=$title $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          # alpha/beta (es. v26.0a3, v26.0b1) -> pre-release
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*[ab][0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifica segreti di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Segreti di firma mancanti:$missing"
            echo "::error::release.yml produce solo APK firmati (BaskinCam-<tag>-signed.apk)."
            echo "::error::Configura i 4 segreti prima di pushare un tag - vedi COMPILAZIONE-E-RELEASE.md §3."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # L'Android SDK e' preinstallato sui runner GitHub (ANDROID_HOME).
      # android-actions/setup-android@v3 non funziona piu' su ubuntu-26.04
      # (esegue "sdkmanager tools", pacchetto inesistente): si usa lo
      # sdkmanager preinstallato per licenze e componenti necessari.
      - name: Prepara Android SDK (preinstallato sul runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - name: Decodifica keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build APK release firmato
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rinomina l'APK con il nome del tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk \
             "out/BaskinCam-${GITHUB_REF_NAME}-signed.apk"

      - name: Pulisci keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Crea la Release e allega l'APK
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ runner.temp }}/release-body.md
          prerelease: ${{ steps.notes.outputs.prerelease }}
          files: out/BaskinCam-${{ github.ref_name }}-signed.apk
