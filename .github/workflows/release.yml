name: Release APK

# Si avvia al push di un tag "v*" (es. v1.6).
# Produce ESATTAMENTE un asset, allegato alla GitHub Release creata per il tag:
#   BaskinCam-<tag>-signed.apk
# Esempio: il tag v1.6 produce "BaskinCam-v1.6-signed.apk".
#
# Questo workflow produce solo APK FIRMATI: se i 4 segreti di firma non sono
# configurati, il job fallisce subito con un messaggio esplicito invece di
# produrre un APK non firmato con un nome che dichiara il contrario.
#
# Segreti richiesti (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    -> il file .jks codificato in base64
#   KEYSTORE_PASSWORD  -> password dello store
#   KEY_ALIAS          -> alias della chiave
#   KEY_PASSWORD       -> password della chiave
# Vedi COMPILAZIONE-E-RELEASE.md §3 per la procedura di generazione/configurazione.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica segreti di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Segreti di firma mancanti:$missing"
            echo "::error::release.yml produce solo APK firmati (BaskinCam-<tag>-signed.apk)."
            echo "::error::Configura i 4 segreti prima di pushare un tag - vedi COMPILAZIONE-E-RELEASE.md §3."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decodifica keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build APK release firmato
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rinomina l'APK con il nome del tag
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk \
             "out/BaskinCam-${GITHUB_REF_NAME}-signed.apk"

      - name: Pulisci keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Allega l'APK alla Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/BaskinCam-${{ github.ref_name }}-signed.apk
          generate_release_notes: true
