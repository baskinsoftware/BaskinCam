    BaskinCam trasforma uno smartphone Android dismesso in una regia
    automatica per lo streaming di partite di Baskin: segue l'azione con
    pan/zoom digitale basato su detection della palla, e sovrappone un
    tabellone punteggio fedele allo stile dell'app Tabellone Baskin.

